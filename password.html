<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Checker | CyberSafe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->

    <header>
        <nav class="navbar">

            <h2 class="logo">CyberSafe</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="threats.html">Cyber Threats</a></li>
                <li><a href="password.html">Password Checker</a></li>
            </ul>

        </nav>
    </header>


    <!-- Password Checker -->

    <section class="password-section">

        <h1>Password Strength Checker 🔐</h1>

        <p>Check how strong your password is.</p>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter your sample password"
            >

            <button onclick="checkPassword()">
                Check Password
            </button>

            <h3 id="result"></h3>

            <p id="suggestions"></p>

        </div>

        <p class="privacy-note">
            Privacy: Your password is checked locally in your browser.
            Do not enter your actual account password.
        </p>

    </section>


    <!-- Footer -->

    <footer>

        <p>© 2026 CyberSafe | Stay Safe Online</p>

    </footer>

    <script src="password.js"></script>

</body>
</html>
